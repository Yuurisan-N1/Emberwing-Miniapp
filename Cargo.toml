[package]
name = "emberwing-bot"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "emberwing-bot"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dotenvy = "0.15"
anyhow = "1"
chrono = "0.4"
reqwest = { version = "0.11", features = ["socks", "rustls-tls", "json"], default-features = false }
url = "2"

[build-dependencies]
winres = "0.1"
